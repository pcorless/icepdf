plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

description = 'JavaFX viewer component example'

// the JavaFX viewer needs JavaFX 22, which runs on Java 17.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // -PmainClass=org.icepdf.examples.javafx.ToolBarExample runs the tool bar example instead.
    mainClass = project.findProperty('mainClass') ?: "org.icepdf.examples.javafx.PdfViewerExample"
    applicationDefaultJvmArgs = ["-Xms64m", "-Xmx1024m"]
}

javafx {
    version = "22.0.2"
    modules = [ 'javafx.controls' ]
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core:core-awt'), project(':viewer:viewer-fx')
}
