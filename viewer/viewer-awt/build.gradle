plugins {
    id 'java'
    id 'application'
}

description = 'ICEpdf viewer reference implementation project'

application {
    mainClass = "org.icepdf.ri.viewer.Launcher"
    applicationDefaultJvmArgs = ["-Xms64m", "-Xmx1024m"]
}

/**
 * Property prefixes forwarded from the Gradle JVM to a forked task JVM.
 *
 * This is deliberately an allowlist rather than a blanket copy of System.properties: the Gradle
 * daemon carries its own java.home, user.dir, file.encoding and friends, and pushing those into
 * the forked JVM would override values that JVM set correctly for itself.
 *
 *   org.icepdf.  - the library's own tuning/behaviour flags
 *   sun.java2d.  - Java2D pipeline selection (opengl, d3d, noddraw, translaccel, accthreshold...)
 *   sun.awt.     - AWT toolkit internals (e.g. sun.awt.noerasebackground)
 *   awt.         - e.g. awt.useSystemAAFontSettings
 *   swing.       - e.g. swing.aatext
 *   javax.swing. - Swing look-and-feel and related settings
 */
ext.forwardedPropertyPrefixes = [
        'org.icepdf.', 'sun.java2d.', 'sun.awt.', 'awt.', 'swing.', 'javax.swing.'
]

/**
 * Forwards allowlisted -D properties from the Gradle JVM to a forked task JVM.
 * Both `run` and `test` launch a separate JVM that does NOT inherit the daemon's system
 * properties, so without this a `./gradlew run -Dorg.icepdf.foo=bar` is silently ignored.
 *
 * Note that graphics-pipeline properties must be present at JVM launch: they are read when the
 * Java2D pipeline initialises, so setting them later from application code has no effect.
 */
def forwardProperties(task) {
    def prefixes = project.ext.forwardedPropertyPrefixes
    System.properties.each { k, v ->
        if (prefixes.any { k.toString().startsWith(it) }) {
            task.systemProperty(k.toString(), v.toString())
        }
    }
}

def sectionName = 'org/icepdf/ri/'
def baseJarName = 'icepdf'
def baseAppendixName  = 'viewer'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core:core-awt')
    implementation project(':core:core-fonts')
    // signature validation.
    implementation 'org.bouncycastle:bcprov-jdk18on:' + "${BOUNCY_VERSION}"
    implementation 'org.bouncycastle:bcpkix-jdk18on:' + "${BOUNCY_VERSION}"
    // tests
    testImplementation(platform("org.junit:junit-bom:${JUNIT_BOM_VERSION}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('org.mockito:mockito-core:5.14.2')
    testImplementation('org.mockito:mockito-junit-jupiter:5.14.2')
    // VeraPDF for PDF/A validation
    testImplementation('org.verapdf:validation-model:1.28.1')
}

// generatePomFileForViewerJarPublication
publishing {
    publications {
        viewerJar(MavenPublication) {
            from components.java
            afterEvaluate {
                groupId = 'org.icepdf.os'
                artifactId = 'icepdf-viewer'
                version = "${VERSION + (RELEASE_TYPE?.trim() ? '-' + RELEASE_TYPE : '')}"
                pom.withXml {
                    asNode().appendNode('description', 'ICEpdf core rendering library.')
                    asNode().appendNode('url', 'https://github.com/pcorless/icepdf')
                    asNode().appendNode('scm')
                            .appendNode('connection', 'scm:git:https://github.com/pcorless/icepdf').parent()
                            .appendNode('url', 'https://www.apache.org/licenses/LICENSE-2.0.txt').parent()
                            .appendNode('tag', 'icepdf-' + version + '-maven')
                    asNode().appendNode('licenses').appendNode('license')
                            .appendNode('name', 'Apache License, Version 2.0').parent()
                            .appendNode('url', 'https://www.apache.org/licenses/LICENSE-2.0.html').parent()
                            .appendNode('distribution', 'repo')
                }
                artifact sourcesJar
                artifact javadocJar
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    // forward opt-in characterization/golden flags to the test JVM
    // e.g. ./gradlew ... -Dupdate.reading.order.golden=true
    ['update.reading.order.golden', 'update.reading.order.xycut.golden',
     'update.word.segmentation.golden'].each { k ->
        if (System.getProperty(k) != null) {
            systemProperty(k, System.getProperty(k))
        }
    }
    forwardProperties(delegate)
}

run {
    forwardProperties(delegate)
}

jar {
    archiveBaseName.set('icepdf')
    archiveAppendix.set("viewer")
    archiveVersion.set("${VERSION}")
    archiveClassifier.set("${RELEASE_TYPE}")

    doFirst {
        manifest {
            attributes ('Created-By': System.getProperty('java.version') + ' (' + System.getProperty('java.vendor') + ')')
            // executable jar
            attributes("Main-Class": 'org.icepdf.ri.viewer.Launcher')
            if (!configurations.runtimeClasspath.isEmpty()) {
                attributes('Class-Path':
                        configurations.runtimeClasspath.files.collect{it.name}.join(' '))
            }
        }
    }

    manifest {
        // section names attributes
        attributes("Implementation-Title": "${archiveBaseName.get() + '-' + archiveAppendix.get()}", "${sectionName}")
        attributes("Implementation-Version": "${VERSION + (RELEASE_TYPE?.trim()? '-' + RELEASE_TYPE:'')}", "${sectionName}")
        attributes("Implementation-Vendor": "${COMPANY}", "${sectionName}")
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    description = 'Assembles a jar archive containing the main classes source code.'
    group = 'Documentation'
    archiveBaseName.set("${baseJarName}")
    archiveAppendix.set("${baseAppendixName}")
    archiveVersion.set("${VERSION}")
    archiveClassifier.set("sources")
    manifest {
        attributes("Implementation-Title": "${archiveBaseName.get() + '-' + archiveAppendix.get()}", "${sectionName}")
        attributes("Implementation-Version": "${VERSION + (RELEASE_TYPE?.trim()? '-' + RELEASE_TYPE:'')}", "${sectionName}")
        attributes("Implementation-Vendor": "${COMPANY}", "${sectionName}")
    }
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    from javadoc
    archiveClassifier.set("javadoc")
}

// Archives are now automatically included via publishing plugin
