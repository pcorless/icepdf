plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

// JavaFX 22 (system colour scheme API) still runs on Java 17; 23+ would need Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

description = 'ICEpdf FX viewer reference implementation project'

// the viewer's heap: -Pxmx=4g on run or runDemo (1024m by default); -Pdevtools opens the render
// devtools window at start.
def viewerXmx = "-Xmx${findProperty('xmx') ?: '1024m'}"

application {
    mainClass = "org.icepdf.fx.ri.app.ViewerApp"
    applicationDefaultJvmArgs = ["-Xms64m", viewerXmx] +
            (project.hasProperty('devtools') ? ['-Dorg.icepdf.fx.devtools=true'] : [])
}

// JavaExec tasks that launch an Application class need JavaFX on the module path ("JavaFX runtime
// components are missing" otherwise); the javafx plugin only does this for 'run'.
def javafxModulePath = { JavaExec task ->
    task.doFirst {
        def fx = task.classpath.filter { it.name.startsWith('javafx-') }
        task.jvmArgs('--module-path', fx.asPath, '--add-modules', 'javafx.controls')
        task.classpath = task.classpath.filter { !it.name.startsWith('javafx-') }
    }
}

// The viewer jar with the jars it needs (JavaFX, core, fonts...) in one folder, for the Linux launcher:
// ./gradlew :viewer:viewer-fx:launcherLibs, then packaging/linux/install-desktop.sh --fx
tasks.register('launcherLibs', Sync) {
    group = 'distribution'
    description = 'Collects the viewer jar and its runtime jars in build/launcher/lib'
    from(jar)
    from(configurations.runtimeClasspath)
    into layout.buildDirectory.dir('launcher/lib')
}

// Several runtime jars register ImageIO plug-ins in META-INF/services (JBIG2, JPEG 2000);
// unpacked into one jar only the first copy of each file would survive, so they're merged here.
def mergedServices = layout.buildDirectory.dir('merged-services')
tasks.register('mergeServices') {
    def jars = configurations.runtimeClasspath
    inputs.files jars
    outputs.dir mergedServices
    doLast {
        def merged = [:].withDefault { new LinkedHashSet<String>() }
        jars.files.findAll { it.name.endsWith('.jar') }.each { f ->
            new java.util.zip.ZipFile(f).withCloseable { zip ->
                zip.entries().findAll { !it.directory && it.name.startsWith('META-INF/services/') }.each { e ->
                    zip.getInputStream(e).text.readLines()*.trim()
                            .findAll { it && !it.startsWith('#') }
                            .each { merged[e.name.substring('META-INF/services/'.length())] << it }
                }
            }
        }
        def out = mergedServices.get().asFile
        project.delete(out)
        out.mkdirs()
        merged.each { name, lines -> new File(out, name).text = lines.join('\n') + '\n' }
    }
}

// The viewer with everything it needs, JavaFX for this platform included, in one jar (as Maven's
// -P assembly): java -jar build/libs/icepdf-viewer-fx-<version>-jar-with-dependencies.jar [file.pdf]
// Signature files and module descriptors are left out: copied in, Bouncy Castle's signature would
// make the launcher reject the jar, and it runs on the class path.
tasks.register('jarWithDependencies', Jar) {
    group = 'distribution'
    description = 'Assembles the viewer and its runtime jars, JavaFX included, into one runnable jar'
    archiveBaseName.set('icepdf')
    archiveAppendix.set('viewer-fx')
    archiveVersion.set("${VERSION}")
    archiveClassifier.set('jar-with-dependencies')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': 'org.icepdf.fx.ri.app.Launcher')
        attributes('Implementation-Title': 'icepdf-viewer-fx')
        attributes('Implementation-Version': "${VERSION + (RELEASE_TYPE?.trim() ? '-' + RELEASE_TYPE : '')}")
        attributes('Implementation-Vendor': "${COMPANY}")
    }
    from(tasks.named('mergeServices')) { into 'META-INF/services' }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/services/**'
    }
    // the unpacked jars' own META-INF/LICENSE and NOTICE files collide, and the JPEG 2000 decoder's
    // OpenJPEG (BSD-2) notice must go with every copy of it
    into('META-INF/licenses') {
        from(rootProject.file('licenses')) { include 'jpx-imageio-*' }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC',
            'module-info.class', 'META-INF/versions/*/module-info.class'
}

// PdfViewDemo, a bare PdfView test host (test sources; the public example is examples/javafx):
// ./gradlew :viewer:viewer-fx:runDemo --args="/path/file.pdf" [-Pxmx=4g]
tasks.register('runDemo', JavaExec) {
    group = 'application'
    description = 'Runs PdfViewDemo, a bare PdfView test host'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.icepdf.fx.demo.PdfViewDemo'
    jvmArgs = [viewerXmx]
    if (project.hasProperty('args')) args project.property('args').toString().split(' ')
    javafxModulePath(it)
}

def sectionName = 'org/icepdf/fx/'
def baseJarName = 'icepdf'
def baseAppendixName  = 'viewer-fx'


javafx {
    version = "22.0.2"
    modules = [ 'javafx.base', 'javafx.controls', 'javafx.graphics' ]
}


dependencies {
    implementation project(':core:core-awt')
    // signature validation.
    implementation 'org.bouncycastle:bcprov-jdk18on:' + "${BOUNCY_VERSION}"
    implementation 'org.bouncycastle:bcpkix-jdk18on:' + "${BOUNCY_VERSION}"
    // RasterBench only (test source set, never shipped) -- see PROVENANCE.md
    testImplementation 'org.jfree:org.jfree.fxgraphics2d:2.1'
    testImplementation "org.openjfx:javafx-swing:${javafx.version}"
    // tests
    testImplementation(platform("org.junit:junit-bom:${JUNIT_BOM_VERSION}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// generatePomFileForViewerJarPublication
publishing {
    publications {
        viewerJar(MavenPublication) {
            from components.java
            afterEvaluate {
                groupId = 'org.icepdf.os'
                artifactId = 'icepdf-viewer-fx'
                version = "${VERSION + (RELEASE_TYPE?.trim() ? '-' + RELEASE_TYPE : '')}"
                pom.withXml {
                    asNode().appendNode('description', 'ICEpdf JX Viewer reference implementation.')
                    asNode().appendNode('url', 'https://github.com/pcorless/icepdf')
                    asNode().appendNode('scm')
                            .appendNode('connection', 'scm:git:https://github.com/pcorless/icepdf').parent()
                            .appendNode('url', 'https://www.apache.org/licenses/LICENSE-2.0.txt').parent()
                            .appendNode('tag', 'icepdf-' + version + '-maven')
                    asNode().appendNode('licenses').appendNode('license')
                            .appendNode('name', 'Apache License, Version 2.0').parent()
                            .appendNode('url', 'https://www.apache.org/licenses/LICENSE-2.0.html').parent()
                            .appendNode('distribution', 'repo')
                }
                artifact sourcesJar
                artifact javadocJar
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    archiveBaseName.set('icepdf')
    archiveAppendix.set("viewer-fx")
    archiveVersion.set("${VERSION}")
    archiveClassifier.set("${RELEASE_TYPE}")

    doFirst {
        manifest {
            attributes ('Created-By': System.getProperty('java.version') + ' (' + System.getProperty('java.vendor') + ')')
            // executable jar
            // a plain class that launches ViewerApp: java -jar refuses an Application main class on the class path
            attributes("Main-Class": 'org.icepdf.fx.ri.app.Launcher')
            if (!configurations.runtimeClasspath.isEmpty()) {
                attributes('Class-Path': configurations.runtimeClasspath.files.collect{it.name}.join(' '))
            }
        }
    }

    manifest {
        // section names attributes
        attributes("Implementation-Title": "${archiveBaseName.get() + '-' + archiveAppendix.get()}", "${sectionName}")
        attributes("Implementation-Version": "${VERSION + (RELEASE_TYPE?.trim()? '-' + RELEASE_TYPE:'')}", "${sectionName}")
        attributes("Implementation-Vendor": "${COMPANY}", "${sectionName}")
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    description = 'Assembles a jar archive containing the main classes source code.'
    group = 'Documentation'
    archiveBaseName.set("${baseJarName}")
    archiveAppendix.set("${baseAppendixName}")
    archiveVersion.set("${VERSION}")
    archiveClassifier.set("sources")
    manifest {
        attributes("Implementation-Title": "${archiveBaseName.get() + '-' + archiveAppendix.get()}", "${sectionName}")
        attributes("Implementation-Version": "${VERSION + (RELEASE_TYPE?.trim()? '-' + RELEASE_TYPE:'')}", "${sectionName}")
        attributes("Implementation-Vendor": "${COMPANY}", "${sectionName}")
    }
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: 'javadoc') {
    from javadoc
    archiveClassifier.set("javadoc")
    // the module's LICENSE / NOTICE, as in its other jars
    metaInf { from('src/main/resources/META-INF') { include 'LICENSE', 'NOTICE' } }
}

// Archives are now automatically included via publishing plugin

// RasterBench: measures the Java2D -> JavaFX raster hand-off candidates (JAVAFX-PAGEVIEW-PLAN.md step 1).
// Lives in the test source set so its bench-only dependencies never ship.
// ./gradlew :viewer:viewer-fx:bench -PbenchArgs="--runs=3;--zooms=1,4;/path/file.pdf#3"   (';' separated)
tasks.register('bench', JavaExec) {
    description = 'Runs RasterBench, the Java2D to JavaFX raster hand-off comparison.'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.icepdf.fx.bench.RasterBench'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    jvmArgs = ['-Xmx1g', '-Dprism.vsync=false', '-Djavafx.animation.fullspeed=true']
    if (project.hasProperty('benchArgs')) {
        args project.property('benchArgs').toString().split(';')
    }
}

// IconSheet: a contact sheet of an icon set (placeholders by default), light and dark.
// ./gradlew :viewer:viewer-fx:iconSheet -PiconArgs="outdir[;icons.properties]"
tasks.register('iconSheet', JavaExec) {
    description = 'Renders every icon of a set at 24 and 16 px, light and dark, to PNG.'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.icepdf.fx.ri.icons.IconSheet'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    if (project.hasProperty('iconArgs')) {
        args project.property('iconArgs').toString().split(';')
    }
}

// ShellSmoke: the new viewer shell (PdfViewer) - rail, utility panel, themes, full screen.
// ./gradlew :viewer:viewer-fx:shellSmoke -PsmokeArgs="outdir;doc.pdf"
tasks.register('shellSmoke', JavaExec) {
    description = 'Drives the PdfViewer shell and snapshots it.'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.icepdf.fx.ri.ShellSmoke'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    jvmArgs = ["-Xmx1g"]
    // e.g. -PsmokeJvmArgs="-Duser.language=fr" to look at a translation
    if (project.hasProperty('smokeJvmArgs')) {
        jvmArgs project.property('smokeJvmArgs').toString().split(';')
    }
    if (project.hasProperty('smokeArgs')) {
        args project.property('smokeArgs').toString().split(';')
    }
}

// AccessibilitySmoke: what a screen reader sees of PdfView, queried as the platform bridges do.
// ./gradlew :viewer:viewer-fx:a11ySmoke -PsmokeArgs="doc.pdf"
tasks.register('a11ySmoke', JavaExec) {
    description = 'Runs AccessibilitySmoke: PdfView\'s screen-reader attributes and caret following.'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.icepdf.fx.view.AccessibilitySmoke'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    jvmArgs = ["-Xmx1g"]
    if (project.hasProperty('smokeArgs')) {
        args project.property('smokeArgs').toString().split(';')
    }
}

// Embedding smokes: an application's own tool bar driving a bare PdfView through the actions.
// ./gradlew :viewer:viewer-fx:embedSmoke -PsmokeArgs="outdir;doc.pdf[;search term]"
// ./gradlew :viewer:viewer-fx:embedInteractionSmoke -PsmokeArgs="outdir;doc.pdf[;keystore.pfx]"
[embedSmoke: 'org.icepdf.fx.embed.EmbedBasicSmoke',
 embedInteractionSmoke: 'org.icepdf.fx.embed.EmbedInteractionSmoke'].each { name, main ->
    tasks.register(name, JavaExec) {
        description = "Runs ${main.tokenize('.').last()}, a host application embedding PdfView."
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = main
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
        jvmArgs = ["-Xmx1g"]
        if (project.hasProperty('smokeJvmArgs')) {
            jvmArgs project.property('smokeJvmArgs').toString().split(';')
        }
        if (project.hasProperty('smokeArgs')) {
            args project.property('smokeArgs').toString().split(';')
        }
    }
}

tasks.register('smoke', JavaExec) {
    description = 'Drives PdfView through zoom/pan/rotate/view-mode steps and snapshots each.'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.icepdf.fx.bench.PdfViewSmoke'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    jvmArgs = ["-Xmx${project.findProperty('smokeXmx') ?: '512m'}"]
    if (project.hasProperty('smokeJvmArgs')) {
        jvmArgs project.property('smokeJvmArgs').toString().split(';')
    }
    if (project.hasProperty('smokeArgs')) {
        args project.property('smokeArgs').toString().split(';')
    }
}
